<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Змейка</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --accent: #22c55e;
        --accent-dark: #16a34a;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .game {
        width: min(92vw, 560px);
        background: color-mix(in oklab, var(--panel) 88%, black);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      }

      .top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }

      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .chip {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 14px;
      }

      button {
        background: linear-gradient(180deg, var(--accent), var(--accent-dark));
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover { filter: brightness(1.05); }

      canvas {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #0b1220;
        border: 1px solid #1f2937;
        border-radius: 10px;
        display: block;
      }

      .hint {
        margin: 12px 0 0;
        font-size: 13px;
        color: #9ca3af;
      }

      .dead { color: var(--danger); }
    </style>
  </head>
  <body>
    <main class="game">
      <div class="top">
        <div class="stats">
          <div class="chip">Счёт: <strong id="score">0</strong></div>
          <div class="chip">Рекорд: <strong id="best">0</strong></div>
          <div class="chip" id="status">Игра идёт</div>
        </div>
        <button id="restart" type="button">Рестарт</button>
      </div>

      <canvas id="board" width="500" height="500" aria-label="Поле змейки"></canvas>
      <p class="hint">Управление: стрелки или WASD. Нажми «Рестарт», чтобы начать заново.</p>
    </main>

    <script>
      const GRID = 20;
      const CELL = 25;

      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const statusEl = document.getElementById('status');
      const restartBtn = document.getElementById('restart');

      const bestKey = 'snake-best-score';
      let best = Number(localStorage.getItem(bestKey) || 0);
      bestEl.textContent = best;

      const initialState = () => ({
        snake: [
          { x: 9, y: 10 },
          { x: 8, y: 10 },
          { x: 7, y: 10 }
        ],
        direction: { x: 1, y: 0 },
        queuedDirection: { x: 1, y: 0 },
        food: randomFood(),
        score: 0,
        dead: false
      });

      let state = initialState();
      let lastTime = 0;
      const speedMs = 110;

      function randomFood() {
        return {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      }

      function placeFood() {
        let candidate = randomFood();
        while (state.snake.some(s => s.x === candidate.x && s.y === candidate.y)) {
          candidate = randomFood();
        }
        state.food = candidate;
      }

      function setDirection(next) {
        const { direction } = state;
        if (direction.x + next.x === 0 && direction.y + next.y === 0) {
          return;
        }
        state.queuedDirection = next;
      }

      function update() {
        if (state.dead) return;

        state.direction = state.queuedDirection;
        const head = state.snake[0];
        const newHead = {
          x: head.x + state.direction.x,
          y: head.y + state.direction.y
        };

        if (
          newHead.x < 0 || newHead.y < 0 ||
          newHead.x >= GRID || newHead.y >= GRID ||
          state.snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)
        ) {
          state.dead = true;
          statusEl.textContent = 'Игра окончена';
          statusEl.classList.add('dead');
          return;
        }

        state.snake.unshift(newHead);

        if (newHead.x === state.food.x && newHead.y === state.food.y) {
          state.score += 1;
          scoreEl.textContent = state.score;
          if (state.score > best) {
            best = state.score;
            bestEl.textContent = best;
            localStorage.setItem(bestKey, String(best));
          }
          placeFood();
        } else {
          state.snake.pop();
        }
      }

      function drawGrid() {
        ctx.fillStyle = '#0b1220';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 1;
        for (let i = 0; i <= GRID; i++) {
          const p = i * CELL;
          ctx.beginPath();
          ctx.moveTo(p, 0);
          ctx.lineTo(p, canvas.height);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(0, p);
          ctx.lineTo(canvas.width, p);
          ctx.stroke();
        }
      }

      function drawFood() {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(state.food.x * CELL + 2, state.food.y * CELL + 2, CELL - 4, CELL - 4);
      }

      function drawSnake() {
        state.snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#22c55e' : '#16a34a';
          ctx.fillRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4);
        });
      }

      function render() {
        drawGrid();
        drawFood();
        drawSnake();
      }

      function gameLoop(ts) {
        if (!lastTime) lastTime = ts;
        if (ts - lastTime >= speedMs) {
          update();
          lastTime = ts;
        }
        render();
        requestAnimationFrame(gameLoop);
      }

      function reset() {
        state = initialState();
        scoreEl.textContent = 0;
        statusEl.textContent = 'Игра идёт';
        statusEl.classList.remove('dead');
      }

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd'].includes(key)) {
          e.preventDefault();
        }

        if (key === 'arrowup' || key === 'w') setDirection({ x: 0, y: -1 });
        if (key === 'arrowdown' || key === 's') setDirection({ x: 0, y: 1 });
        if (key === 'arrowleft' || key === 'a') setDirection({ x: -1, y: 0 });
        if (key === 'arrowright' || key === 'd') setDirection({ x: 1, y: 0 });
      });

      restartBtn.addEventListener('click', reset);

      reset();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
